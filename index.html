<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Compact Data Tiles</title>
    <style>
        :root {
            /* iOS 18 Glassmorphism Palette */
            --bg-color: #0e0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover-bg: rgba(255, 255, 255, 0.09);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            --box-bg: rgba(255, 255, 255, 0.07);
            --box-border: rgba(255, 255, 255, 0.08);
            
            --text-primary: #f5f5f7;
            --text-secondary: rgba(235, 235, 245, 0.6);
            
            --accent-blue: #0a84ff;
            --accent-blue-glow: rgba(10, 132, 255, 0.4);
            --accent-cyan: #64d2ff;
            --accent-green: #30d158;
            
            --radius-card: 14px;
            --radius-box: 8px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f2f2f7;
                --card-bg: rgba(255, 255, 255, 0.75);
                --card-border: rgba(255, 255, 255, 0.9);
                --card-hover-bg: rgba(255, 255, 255, 0.95);
                --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
                
                --box-bg: rgba(0, 0, 0, 0.04);
                --box-border: rgba(0, 0, 0, 0.05);
                
                --text-primary: #1c1c1e;
                --text-secondary: #8e8e93;
                
                --accent-blue: #007aff;
                --accent-blue-glow: rgba(0, 122, 255, 0.25);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 8px;
            margin: 0;
            overflow-x: hidden;
            user-select: none;
            min-height: 100vh;
        }

        /* Floating Pill Toast */
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: rgba(22, 22, 26, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: -0.1px;
            z-index: 1000;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* 2-Column Grid Layout with Column-First Flow */
        .app-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-flow: column;
            gap: 6px;
            width: 100%;
        }

        /* Enhanced Glassmorphism Card (Row) */
        .row-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 6px 8px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .row-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(10, 132, 255, 0.4);
            box-shadow: 0 4px 16px var(--accent-blue-glow);
            transform: translateY(-1px);
        }

        .row-card:active {
            transform: scale(0.98);
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .row-card:active .sno-badge {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.25);
        }

        .row-card:active .data-box {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }

        /* Minimal Index Badge */
        .sno-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(100, 210, 255, 0.1);
            border-radius: 6px;
            padding: 3px 6px;
            flex-shrink: 0;
            letter-spacing: -0.2px;
            transition: all 0.2s ease;
        }

        /* Dynamic Auto-Sized Wrap */
        .boxes-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        /* Apple Premium Data Box */
        .data-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: var(--radius-box);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-primary);
            width: max-content;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.35;
            letter-spacing: -0.1px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* Loader */
        .state-container {
            grid-column: span 2;
            padding: 40px 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 132, 255, 0.15);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-dot"></div>
        <span id="toast-text">Copied</span>
    </div>

    <!-- 2-Column App Container -->
    <div class="app-container" id="appContainer">
        <div id="loader" class="state-container">
            <div class="spinner"></div>
            Loading spreadsheet...
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQK8gfdwc3HNqAfJ8mO1CGuwg6KFsFcIupABIgpl5_vCubFyFz0g4JKVwOyFzrGv5oEBSZzUL3zdxHj/pub?gid=0&single=true&output=csv';

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            const result = [];
            for (let line of lines) {
                if (!line.trim()) continue;
                const row = [];
                let insideQuote = false;
                let entry = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row);
            }
            return result;
        }

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error();
                const csvText = await response.text();
                const data = parseCSV(csvText);

                if (data.length > 0) {
                    renderBoxes(data.slice(1));
                } else {
                    showError('No data found');
                }
            } catch (err) {
                showError('Error loading data');
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = 'Copied: ' + text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1000);
        }

        function renderBoxes(rows) {
            const container = document.getElementById('appContainer');
            container.innerHTML = '';

            const halfCount = Math.ceil(rows.length / 2);
            container.style.gridTemplateRows = `repeat(${halfCount}, auto)`;

            rows.forEach((row, rIdx) => {
                const card = document.createElement('div');
                card.className = 'row-card';

                const rowText = row.filter(val => val).join(' | ');
                card.onclick = () => {
                    if (!rowText) return;
                    navigator.clipboard.writeText(rowText).then(() => {
                        showToast(rowText);
                    });
                };

                const sno = document.createElement('div');
                sno.className = 'sno-badge';
                sno.innerText = rIdx + 1;
                card.appendChild(sno);

                const wrap = document.createElement('div');
                wrap.className = 'boxes-wrap';

                row.forEach(val => {
                    if (!val) return;
                    
                    const box = document.createElement('div');
                    box.className = 'data-box';
                    box.innerText = val;

                    wrap.appendChild(box);
                });

                card.appendChild(wrap);
                container.appendChild(card);
            });
        }

        function showError(msg) {
            document.getElementById('appContainer').innerHTML = `<div class="state-container">${msg}</div>`;
        }

        fetchData();
    </script>
</body>
</html>
